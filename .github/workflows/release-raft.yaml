name: Verify Waterbase OpenRaft package

on:
  push:
    tags:
      - "waterbase-openraft-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#waterbase-openraft-v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "waterbase-openraft") | .version')"
          test "$actual" = "$expected"
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy -p waterbase-openraft --lib --features serde,storage-v2 -- -D warnings
      - name: Test Khepri feature set
        run: cargo test -p waterbase-openraft --lib --features serde,storage-v2
      - name: Construct package without publishing
        run: cargo package -p waterbase-openraft --locked
